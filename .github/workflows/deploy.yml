name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build stamp
        run: |
          echo "PUBLIC_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm
        env:
          PUBLIC_GIT_SHA: ${{ env.PUBLIC_GIT_SHA }}
          PUBLIC_BUILD_TIME: ${{ env.PUBLIC_BUILD_TIME }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
